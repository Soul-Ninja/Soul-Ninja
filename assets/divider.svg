<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 12" width="100%" height="12" fill="none">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0"/>
      <stop offset="25%" stop-color="#6C5CE7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="75%" stop-color="#087F5B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#087F5B" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Glow Line -->
  <line x1="40" y1="6" x2="760" y2="6" stroke="url(#dividerGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Core Sharp Line -->
  <line x1="40" y1="6" x2="760" y2="6" stroke="url(#dividerGrad)" stroke-width="1.5"/>

  <!-- Center Diamond Accent -->
  <g transform="translate(400, 6)">
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#8B5CF6"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
